version: '3.8'

services:
  server:
    build: ./server
    ports:
      - '5000:5000'
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/mern-ecommerce
      # You should use environment variables for secrets in a real app
      JWT_SECRET: secret
      STRIPE_SECRET_KEY: your_stripe_secret_key
    volumes:
      - ./server:/app/server
      - /app/server/node_modules

  client:
    build: ./client
    ports:
      - '3000:80'
    depends_on:
      - server
    volumes:
      - ./client:/app/client
      - /app/client/node_modules

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
